<!DOCTYPE html>
<html>
<head>
  <title>Perfume Order Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f3f1;
      margin: 20px;
    }

    .container {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-container h1 {
      text-align: center;
      color: #7b3f00;
    }

    label {
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #7b3f00;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #a0522d;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 150px;
    }

    .perfume-image img {
      width: 300px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="logo">
    <!-- Replace with your actual logo image -->
    <img src="https://i.imgur.com/Qz1zjG9.png" alt="Perfume Logo">
  </div>

  <div class="container">
    
    <!-- Perfume Image -->
    <div class="perfume-image">
      <!-- Replace with your actual perfume product image -->
      <img src="image/ChatGPT Image Mar 14, 2026, 05_32_56 PM.png" alt="Perfume Bottle">
    </div>

    <!-- Form Section -->
    <div class="form-container">
      <h1>Order Your Perfume</h1>
      <form action="/submit-order" method="post">

        <label for="customerName">Full Name:</label>
        <input type="text" id="customerName" name="customerName" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="address">Shipping Address:</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="perfume">Select Perfume:</label>
        <select id="perfume" name="perfume" required>
          <option value="">--Choose a Perfume--</option>
          <option value="rose">Rose Bloom</option>
          <option value="jasmine">Jasmine Dream</option>
          <option value="oud">Oud Royale</option>
          <option value="lemon">Lemon Zest</option>
          <option value="sandalwood">Sandalwood Mist</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" required>

        <label>Delivery Option:</label><br>
        <input type="radio" name="delivery" value="standard" checked> Standard (3-5 days)<br>
        <input type="radio" name="delivery" value="express"> Express (1-2 days)<br><br>

        <label for="notes">Additional Notes (optional):</label>
        <textarea id="notes" name="notes" rows="2"></textarea>

        <button type="submit">Submit Order</button>

      </form>
    </div>
  </div>

</body>
</html>
